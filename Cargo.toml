[package]
name = "finalproject_rustminios"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
heapless = "0.9.2"
libm = "0.2.16"
panic-halt = "1.0.0"
stm32f4 = { version = "0.16.0", features = ["stm32f407"] }

[build-dependencies]
cc = "1.2.16"

[profile.dev]
codegen-units = 1
debug = 2
lto = false
opt-level = 2

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = 3
