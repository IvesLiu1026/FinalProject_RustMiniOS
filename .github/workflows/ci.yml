name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host-checks:
    name: Host Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Linux serial dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      - name: Run host-side tests
        working-directory: host_checks
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Check Mac companion
        working-directory: mac_companion
        run: cargo check --target x86_64-unknown-linux-gnu

  firmware-check:
    name: Firmware Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add thumbv7em-none-eabihf

      - name: Install PlatformIO packages
        run: |
          python -m pip install --upgrade pip platformio
          python -m platformio pkg install -g \
            -p platformio/ststm32 \
            -t platformio/toolchain-gccarmnoneeabi \
            -t platformio/framework-cmsis \
            -t platformio/framework-cmsis-stm32f4

      - name: Check firmware build
        run: cargo check --target thumbv7em-none-eabihf
